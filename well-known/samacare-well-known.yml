source: live GET probes of /.well-known/* on every SamaCare host in apis.yml
note: >-
  No SamaCare host serves a /.well-known document. The marketing site (Webflow) answers
  every /.well-known/* path with a 404 HTML body reading "Invalid .well-known request".
  The API host api.samacare.com answers every path — /.well-known/* included — with an
  HTTP 401 and an RFC 6750 challenge (WWW-Authenticate: Bearer error="invalid_token",
  error_description="Missing Authorization header"), so even anonymous discovery documents
  are behind the token gate. app.samacare.com is a single-page app whose catch-all returns
  HTTP 200 with the app HTML shell for every path; those 200s are NOT documents and are
  recorded as misses. No WellKnown or SecurityTxt pointer is emitted, because nothing was
  served.
