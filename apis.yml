aid: samacare
name: SamaCare
description: >-
  SamaCare operates a medical benefit prior authorization platform used by specialty
  practices in oncology, rheumatology, neurology, retina/ophthalmology and infusion care to
  submit, track and renew prior authorizations for provider-administered ("buy and bill")
  drugs across every payer in one place. The platform combines payer-specific form
  intelligence and auto-fill, human-in-the-loop AI, status tracking and expiration
  reminders with one-click re-authorization, and a market-access analytics layer that
  pharmaceutical manufacturers license for benchmark and patient-access insight. SamaCare
  states it has processed more than two million medical benefit prior authorizations
  representing over $6B in annual drug spend, and integrates into practice systems —
  NextGen Enterprise and ModMed EMRs among them — over an API-based two-way exchange of
  demographic data and clinical documentation. The platform API is served from
  api.samacare.com behind an OAuth 2.0 Bearer challenge and is arranged through EHR/RCM
  partnership rather than a public developer program; no public API reference, OpenAPI
  contract or self-serve key issuance is published.
