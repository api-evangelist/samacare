note: >-
  SamaCare publishes NO client SDK for its platform API. The four packages below are the
  entire published first-party footprint and every one of them is internal engineering
  tooling — a shared ESLint config, a metrics client, a Node diagnostics collector and a
  fork of io-ts-types — not a library that wraps api.samacare.com. No `SDKs` pointer is
  emitted in apis.yml for that reason: sdk_count would be credited for libraries that do
  not call the API. Every package is dormant: the newest release is 2022-04-27, more than
  four years stale, and the @samacare npm scope has published nothing since. PyPI, RubyGems,
  Maven Central, NuGet, crates.io and pkg.go.dev return no SamaCare package. The public
  GitHub org github.com/SamaCare holds four repos, three of them upstream forks
  (puppeteer-extra, io-ts-types) or an archived engineering-practices doc; none is an API
  client.
